<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月間の配信通数を、計画から確かめる</title><meta name="description" content="配信ごとの人数と回数を分け、契約前に必要な通数を整理します。"><link rel="stylesheet" href="style.css"><script defer src="logic.js"></script><script defer src="app.js"></script></head><body><main><nav><a href="../">戻る / Back</a></nav><h1>月間の配信通数を、計画から確かめる</h1><p>配信ごとの人数と回数を分け、契約前に必要な通数を整理します。</p><p>メールアドレス・顧客情報は入力しません。計画は端末内だけで処理します。重複しない登録連絡先数と、各配信の対象人数は別の数字です。</p><form id="form"><label>重複しない登録連絡先数（未確認なら空欄）<input id="contacts" inputmode="numeric" placeholder="例: 1200"></label><div id="rows"></div><button type="button" id="add">配信枠を追加</button><label>上の枠以外のテスト・追加通数<input id="extra" inputmode="numeric" placeholder="不明なら空欄"></label><button>必要通数を整理</button></form><section id="result" hidden><h2>今月の配信計画</h2><pre id="report"></pre><button id="download">計画をTXTで保存</button><a class="button" href="../contract-cost/">確認した数で契約費用を検討</a><p>契約費用の画面には数を自分で入力してください。追加通数が未確認なら合計も未確認です。無料プランや既存媒体で足りる場合は新たな契約は不要です。配信・購入・申込は自動実行しません。</p></section><footer>入力はこのページ内で処理します。入力内容を送信・保存する通信はありません。販売ページへ進む場合は別サービスが開きます。</footer></main></body></html>
